#==============================================================================
# FONTES
#==============================================================================

# Fonte principal. Recomenda-se usar uma Nerd Font para ícones glyphs.
# Exemplos populares: JetBrains Mono Nerd Font, FiraCode Nerd Font, MesloLGS NF.
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Tamanho da fonte em pontos
font_size 11.0

# Habilitar ligaduras (opcional, requer fontes como Fira Code ou JetBrains Mono)
disable_ligatures never

#==============================================================================
# TEMA DE CORES: DRACULA OFFICIAL (Formatação corrigida)
#==============================================================================

foreground            #f8f8f2
background            #282a36
selection_background  #44475a
selection_foreground  #f8f8f2

# Cores do cursor
cursor                #f8f8f2
cursor_text_color     #282a36

# --- Cores base (Normal) ---

# Preto (Pode ser ajustado para #21222C para um visual Dracula mais suave)
color0   #000000
# Vermelho
color1   #ff5555
# Verde
color2   #50fa7b
# Amarelo
color3   #f1fa8c
# Roxo (usado como Azul no Dracula)
color4   #bd93f9
# Magenta/Rosa
color5   #ff79c6
# Ciano
color6   #8be9fd
# Cinza Claro (Substituto para branco)
color7   #bfbfbf

# --- Cores Brilhantes ---

# Cinza Escuro (Comentário Dracula)
color8   #44475a
# Vermelho Brilhante
color9   #ff6e6e
# Verde Brilhante
color10  #69ff94
# Amarelo Brilhante
color11  #ffffa5
# Roxo Brilhante
color12  #d6acff
# Magenta/Rosa Brilhante
color13  #ff92df
# Ciano Brilhante
color14  #a4ffff
# Branco
color15  #ffffff

#==============================================================================
# TRANSPARÊNCIA E EFEITOS VISUAIS (BLUR)
#==============================================================================

# Define a opacidade do fundo. 1.0 é totalmente opaco, 0.0 é totalmente transparente.
# Um valor entre 0.8 e 0.95 é recomendado para manter a legibilidade.
background_opacity 0.85

# Para Hyprland/Picom: Defina a opacidade acima. O compositor aplicará o blur.
# Para macOS nativo: descomente a linha abaixo para usar o blur nativo do Kitty.
# background_blur 10

# Permite que a opacidade se aplique apenas a janelas inativas (opcional)
# background_opacity_in_active 1.0

#==============================================================================
# LAYOUT DA JANELA E PADDING
#==============================================================================

# Esconde a barra de título da janela (útil em tiling window managers como Hyprland)
hide_window_decorations yes

# Define o layout inicial da janela (pode ser "last" para lembrar o último usado)
remember_window_size  yes
initial_window_width  960
initial_window_height 600

# Espaçamento interno (padding) dentro da janela do terminal
window_padding_width 10

#==============================================================================
# CURSOR
#==============================================================================

# Estilo do cursor (pode ser block, beam, underline)
cursor_shape beam

# Piscar do cursor
cursor_blink_interval 0.5

# Parar de piscar após X segundos de inatividade
cursor_stop_blinking_after 15.0

#==============================================================================
# FUNCIONALIDADES E QUALIDADE DE VIDA
#==============================================================================

# Número de linhas para manter no buffer de scrollback
scrollback_lines 10000

# Permitir controle remoto do Kitty (útil para scripts e extensões)
allow_remote_control yes

# Abrir URLs clicadas no navegador padrão
open_url_with default

# Copiar para a área de transferência ao selecionar texto com o mouse
copy_on_select yes

# Confirmação ao fechar o Kitty se houver processos rodando
confirm_os_window_close 0
